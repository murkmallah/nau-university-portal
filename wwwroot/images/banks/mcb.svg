<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="mcbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="url(#mcbBg)" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- MCB Signature Pinwheel / Petal Emblem -->
  <g transform="translate(60, 46)">
    <!-- 8 radial petals in red and orange -->
    <path d="M 0,-24 C 6,-24 10,-18 8,-12 C 6,-6 0,-4 0,-4 C 0,-4 -6,-6 -8,-12 C -10,-18 -6,-24 0,-24 Z" fill="#e31837" transform="rotate(0)"/>
    <path d="M 0,-24 C 6,-24 10,-18 8,-12 C 6,-6 0,-4 0,-4 C 0,-4 -6,-6 -8,-12 C -10,-18 -6,-24 0,-24 Z" fill="#f58220" transform="rotate(45)"/>
    <path d="M 0,-24 C 6,-24 10,-18 8,-12 C 6,-6 0,-4 0,-4 C 0,-4 -6,-6 -8,-12 C -10,-18 -6,-24 0,-24 Z" fill="#e31837" transform="rotate(90)"/>
    <path d="M 0,-24 C 6,-24 10,-18 8,-12 C 6,-6 0,-4 0,-4 C 0,-4 -6,-6 -8,-12 C -10,-18 -6,-24 0,-24 Z" fill="#f58220" transform="rotate(135)"/>
    <path d="M 0,-24 C 6,-24 10,-18 8,-12 C 6,-6 0,-4 0,-4 C 0,-4 -6,-6 -8,-12 C -10,-18 -6,-24 0,-24 Z" fill="#e31837" transform="rotate(180)"/>
    <path d="M 0,-24 C 6,-24 10,-18 8,-12 C 6,-6 0,-4 0,-4 C 0,-4 -6,-6 -8,-12 C -10,-18 -6,-24 0,-24 Z" fill="#f58220" transform="rotate(225)"/>
    <path d="M 0,-24 C 6,-24 10,-18 8,-12 C 6,-6 0,-4 0,-4 C 0,-4 -6,-6 -8,-12 C -10,-18 -6,-24 0,-24 Z" fill="#e31837" transform="rotate(270)"/>
    <path d="M 0,-24 C 6,-24 10,-18 8,-12 C 6,-6 0,-4 0,-4 C 0,-4 -6,-6 -8,-12 C -10,-18 -6,-24 0,-24 Z" fill="#f58220" transform="rotate(315)"/>
    <!-- Center white circle with red dot -->
    <circle cx="0" cy="0" r="7" fill="#ffffff"/>
    <circle cx="0" cy="0" r="3.5" fill="#e31837"/>
  </g>

  <!-- MCB Wordmark -->
  <text x="60" y="96" text-anchor="middle" fill="#003366" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="20" letter-spacing="2">MCB</text>
  <text x="60" y="107" text-anchor="middle" fill="#f58220" font-family="'Montserrat', sans-serif" font-weight="700" font-size="9" letter-spacing="3">BANK</text>
</svg>
