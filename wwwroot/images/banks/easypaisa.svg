    <path d="M 0,-24 C 14,-24 24,-14 24,0 C 24,6 22,12 18,17 L 9,10 C 12,7 13,4 13,0 C 13,-8 7,-14 0,-14 C -7,-14 -13,-8 -13,0 C -13,8 -7,14 0,14 C 4,14 7,13 10,10 L 18,17 C 13,22 7,24 0,24 C -14,24 -24,14 -24,0 C -24,-14 -14,-24 0,-24 Z" fill="#ffffff"/>
    <!-- Center bar of 'e' -->
