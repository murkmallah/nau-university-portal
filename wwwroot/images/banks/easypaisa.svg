<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="epGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a859"/>
      <stop offset="100%" stop-color="#008043"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="url(#epGrad)"/>
  
  <!-- Easypaisa Iconic 'e' Mobile/Rupee Logo -->
