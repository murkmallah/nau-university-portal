    <!-- Rupee / Dot accent -->
    <circle cx="18" cy="-14" r="4.5" fill="#ffd200"/>
  </g>

  <!-- Easypaisa Text -->
  <text x="60" y="96" text-anchor="middle" fill="#ffffff" font-family="'Montserrat', sans-serif" font-weight="800" font-size="13" letter-spacing="0.5">easypaisa</text>
  <text x="60" y="108" text-anchor="middle" fill="#a7f3d0" font-family="'Montserrat', sans-serif" font-weight="600" font-size="8.5" letter-spacing="1">WALLET</text>
